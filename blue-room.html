<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blue Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.45">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌀%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blue-room.css">
</head>
<body>
  <div class="headlineWrap" id="headlineWrap">
    <div class="headline" id="headline"></div>
    <div class="headerActions" id="headerActions">
      <div class="blue-room-header-controls" id="session-actions" hidden>
        <button class="pillToggle" type="button" id="run-control">Resume</button>
        <button class="pillToggle" type="button" id="show-now">Latest</button>
      </div>
      <button class="pillToggle blue-room-back" type="button" id="back-button" hidden>Back</button>
    </div>
  </div>

  <form class="search-bar blue-room-start" id="casting-form">
    <fieldset id="casting-fields">
      <textarea id="scenario" required aria-label="The situation" rows="3" placeholder="A conversation between two people. Describe the situation. Who are they, and what are they talking about?"></textarea>
      <button class="pillToggle" type="submit">Start</button>
    </fieldset>
  </form>

  <p class="caption pageHeader blue-room-context" id="context-prompt" hidden></p>

  <div class="small blue-room-content" id="content">
    <p id="notice" role="status" aria-live="polite"></p>

    <section id="session-panel" hidden aria-labelledby="headline">
      <div class="blue-room-controls">
        <p id="progress" role="status" aria-live="polite"></p>
      </div>
      <div id="transcript" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
    </section>

    <section id="history-panel" aria-labelledby="headline">
      <p id="history-notice"></p>
      <div class="items large" id="sessions"></div>
    </section>
  </div>

  <dialog id="persona-dialog" aria-labelledby="persona-title">
    <form method="dialog"><button class="dialog-close" aria-label="Close character brief">Close</button></form>
    <h2 id="persona-title"></h2>
    <p id="persona-brief" class="blue-room-verbatim"></p>
  </dialog>

  <script src="blue-room-loop.js"></script>
  <script src="blue-room-reveal.js"></script>
  <script src="blue-room.js"></script>
</body>
</html>
